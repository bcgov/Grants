name: Dev - Build & Push docker images
permissions:
  contents: read

on:
  push:
    branches: [ "dev" ]
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - 'database/**'
      - 'documentation/**'
      - '**/docs/**'
      - '**/README*'
      - 'CODE_OF_CONDUCT.md'
      - 'COMPLIANCE.yaml'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'
      - 'SECURITY.md'
  # Allow manual workflow triggering
  workflow_dispatch:
# Workflow dependencies
env:
  TARGET_ENV: dev
  GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
  OC_CLUSTER: ${{ vars.OPENSHIFT_CLUSTER }}
  OC_REGISTRY: ${{ vars.OPENSHIFT_REGISTRY }}
  OC_TOOLS_TOKEN: ${{ secrets.TOOLS_OPENSHIFT_TOKEN }}
  OC_TOOLS_PROJECT: ${{ vars.TOOLS_OPENSHIFT_NAMESPACE }}
  OC_TARGET_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
  OC_TARGET_PROJECT: ${{ vars.OPENSHIFT_NAMESPACE }}
  JFROG_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
  JFROG_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
  JFROG_REPO_PATH: ${{ vars.ARTIFACTORY_REPO }}
  JFROG_SERVICE:  ${{ vars.ARTIFACTORY_SERVICE }}
  GRANTS_BUILD_VERSION: ${{vars.GRANTS_BUILD_VERSION}}
  GRANTS_BUILD_REVISION: ${{vars.GRANTS_BUILD_REVISION}}

  GRANTS_RELEASE_PREFIX: Grants_Applicant_Portal_v
  GRANTS_RELEASE_MESSAGE: "Development deployment"

jobs:
  Setup:
    runs-on: ubuntu-latest
    environment: dev
    steps:
    - name: Get variables
      run: |
        echo "Target: $TARGET_ENV"
        echo "BaseRef: $GITHUB_REF_NAME"
        echo "Environment: $TARGET_ENV OC_TOOLS_PROJECT=$OC_TOOLS_PROJECT OC_TARGET_PROJECT=$OC_TARGET_PROJECT"
        echo "Environment: $TARGET_ENV JFROG_REPO_PATH=$JFROG_REPO_PATH"
        echo "..."
        env | sort
    - name: Get current date
      id: date_selector
      run: |
        echo "DATE=$(date +'%B %e, %Y')" >> $GITHUB_OUTPUT
    outputs:
      DATE: ${{steps.date_selector.outputs.DATE}}
  Branch:
    needs: [Setup]
    runs-on: ubuntu-latest
    environment: dev
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
          fetch-depth: '1'
    - name: Get short commitId
      id: get_commit
      run: |
        echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
    - name: List merged branch
      id: get_branch
      run: |
        git log -1
        MERGED_BRANCH=$(git log -1 | grep -oE 'from bcgov/[^ ]+' | sed 's/from bcgov\///')
        if [ -z "$MERGED_BRANCH" ]; then
          echo "Direct push into --env ${{env.TARGET_ENV}}"
          echo "MERGED_BRANCH=push" >> $GITHUB_OUTPUT
        else
          echo "Merged branch: $MERGED_BRANCH"
          echo "MERGED_BRANCH=$MERGED_BRANCH" >> $GITHUB_OUTPUT
        fi
    outputs:
      SHA_SHORT: ${{steps.get_commit.outputs.SHA_SHORT}}
      MERGED_BRANCH: ${{steps.get_branch.outputs.MERGED_BRANCH}}
  PushVariables:
    needs: [Setup,Branch]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GH_API_TOKEN }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
          fetch-depth: '1'
    - name: Set repository version variables
      id: set_version
      run: |
        gh variable set GRANTS_BUILD_REVISION --env ${{env.TARGET_ENV}} --body "${{needs.Branch.outputs.SHA_SHORT}}"
        echo "GRANTS_BUILD_REVISION=${{needs.Branch.outputs.SHA_SHORT}}" >> $GITHUB_ENV
    - name: Get repository version variables
      id: get_version
      run: |
        gh variable list --env ${{env.TARGET_ENV}}
        echo "..."
        echo "buildArgs --env ${{env.TARGET_ENV}} GRANTS_BUILD_VERSION: ${{env.GRANTS_BUILD_VERSION}}, GRANTS_BUILD_REVISION: ${{env.GRANTS_BUILD_REVISION}}, Merged Branch: ${{needs.Branch.outputs.MERGED_BRANCH}}"
  Build:
    needs: [Setup,Branch,PushVariables]
    runs-on: ubuntu-latest
    environment: dev
    steps:
    - uses: actions/checkout@v6
    - name: Build Docker images
      run: |
        echo "buildArgs GRANTS_BUILD_VERSION: ${{env.GRANTS_BUILD_VERSION}}, GRANTS_BUILD_REVISION: ${{env.GRANTS_BUILD_REVISION}}"
        docker build --build-arg GRANTS_BUILD_VERSION=${{env.GRANTS_BUILD_VERSION}} --build-arg GRANTS_BUILD_REVISION=${{env.GRANTS_BUILD_REVISION}} -t grants-applicant-portal-backend -f applications/Grants.ApplicantPortal/src/Grants.ApplicantPortal.Backend/Dockerfile applications/Grants.ApplicantPortal/src/Grants.ApplicantPortal.Backend
        docker build --build-arg GRANTS_BUILD_VERSION=${{env.GRANTS_BUILD_VERSION}} --build-arg GRANTS_BUILD_REVISION=${{env.GRANTS_BUILD_REVISION}} --build-arg BUILD_CONFIG=deploy -t grants-applicant-portal-frontend -f applications/Grants.ApplicantPortal/src/Grants.ApplicantPortal.Frontend/Dockerfile applications/Grants.ApplicantPortal/src/Grants.ApplicantPortal.Frontend
        echo "Building Docker image for database migrator..."
        docker build -f applications/Grants.ApplicantPortal/src/Grants.ApplicantPortal.Backend/src/Grants.ApplicantPortal.API.Migrations/Dockerfile -t dev-applicantportal-dbmigrator applications/Grants.ApplicantPortal/src/Grants.ApplicantPortal.Backend
      working-directory: ./
    - name: Push application images to Artifactory container registry
      continue-on-error: true
      run: |
        echo "$JFROG_PASSWORD" | docker login -u "$JFROG_USERNAME" --password-stdin $JFROG_SERVICE
        docker tag grants-applicant-portal-backend $JFROG_SERVICE/$JFROG_REPO_PATH/grants-applicant-portal-backend:latest
        docker push $JFROG_SERVICE/$JFROG_REPO_PATH/grants-applicant-portal-backend:latest
        docker tag grants-applicant-portal-frontend $JFROG_SERVICE/$JFROG_REPO_PATH/grants-applicant-portal-frontend:latest
        docker push $JFROG_SERVICE/$JFROG_REPO_PATH/grants-applicant-portal-frontend:latest
        docker tag dev-applicantportal-dbmigrator $JFROG_SERVICE/$JFROG_REPO_PATH/dev-applicantportal-dbmigrator:latest
        docker push $JFROG_SERVICE/$JFROG_REPO_PATH/dev-applicantportal-dbmigrator:latest
        docker logout $JFROG_SERVICE
    - name: Install OpenShift CLI
      run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz
          tar -xvf oc.tar.gz
          sudo mv oc /usr/local/bin
    - name: Verify OpenShift CLI installation
      run: oc version
    - name: Push application images into ce395f-tools
      run: |
        oc login --token=$OC_TOOLS_TOKEN --server=$OC_CLUSTER
        oc registry login
        docker login -u unused -p $(oc whoami -t) $OC_REGISTRY
        docker tag grants-applicant-portal-backend $OC_REGISTRY/$OC_TOOLS_PROJECT/$TARGET_ENV-grants-applicant-portal-backend:latest
        docker push $OC_REGISTRY/$OC_TOOLS_PROJECT/$TARGET_ENV-grants-applicant-portal-backend:latest
        docker tag grants-applicant-portal-frontend $OC_REGISTRY/$OC_TOOLS_PROJECT/$TARGET_ENV-grants-applicant-portal-frontend:latest
        docker push $OC_REGISTRY/$OC_TOOLS_PROJECT/$TARGET_ENV-grants-applicant-portal-frontend:latest
        docker tag dev-applicantportal-dbmigrator $OC_REGISTRY/$OC_TOOLS_PROJECT/$TARGET_ENV-grants-applicant-portal-dbmigrator:latest
        docker push $OC_REGISTRY/$OC_TOOLS_PROJECT/$TARGET_ENV-grants-applicant-portal-dbmigrator:latest
        docker logout $OC_REGISTRY
    - name: Promote dbMigrator into ce395f-dev and run migrations
      run: |
        oc login --token=$OC_TARGET_TOKEN --server=$OC_CLUSTER
        oc tag $OC_TOOLS_PROJECT/$TARGET_ENV-grants-applicant-portal-dbmigrator:latest $OC_TARGET_PROJECT/$TARGET_ENV-grants-applicant-portal-dbmigrator:latest
        oc -n $OC_TARGET_PROJECT delete jobs $TARGET_ENV-grants-applicant-portal-dbmigrator --ignore-not-found=true
        oc -n $OC_TARGET_PROJECT process unity-applicantportal-dbmigrator-job \
          -p APPLICATION_GROUP=$TARGET_ENV-unity-applicant-portal \
          -p DATABASE_SERVICE_NAME=$TARGET_ENV-unity-applicant-portal \
          -p APPLICATION_NAME=$TARGET_ENV-grants-applicant-portal-dbmigrator \
          -p IMAGEPULL_NAMESPACE=$OC_TARGET_PROJECT \
          -p IMAGESTREAM_NAME=$TARGET_ENV-grants-applicant-portal-dbmigrator \
          -p IMAGESTREAM_TAG=latest | oc -n $OC_TARGET_PROJECT create -f -
        oc -n $OC_TARGET_PROJECT wait jobs/$TARGET_ENV-grants-applicant-portal-dbmigrator --for condition=complete --timeout=300s
    - name: Promote backend/frontend into ce395f-dev and roll out
      run: |
        oc tag $OC_TOOLS_PROJECT/$TARGET_ENV-grants-applicant-portal-backend:latest $OC_TARGET_PROJECT/$TARGET_ENV-grants-applicant-portal-backend:latest
        oc tag $OC_TOOLS_PROJECT/$TARGET_ENV-grants-applicant-portal-frontend:latest $OC_TARGET_PROJECT/$TARGET_ENV-grants-applicant-portal-frontend:latest
        oc -n $OC_TARGET_PROJECT rollout restart statefulset $TARGET_ENV-grants-api
        oc -n $OC_TARGET_PROJECT rollout restart statefulset $TARGET_ENV-grants-web
        oc -n $OC_TARGET_PROJECT rollout status statefulset $TARGET_ENV-grants-api --timeout=180s
        oc -n $OC_TARGET_PROJECT rollout status statefulset $TARGET_ENV-grants-web --timeout=180s
