name: Cypress E2E (runner)

# Shared job called by cypress-dev/test/uat/prod.yml.
# Writes the env config from a secret, installs deps, and runs headless Cypress.
#
# Credentials come from one repo secret, GRANTS_CYPRESS_CONFIG: a JSON object
# keyed by cypress_config_key (CYPRESS_CONFIG_DEV/TEST/UAT/PROD), each value
# being that env's cypress/config/<env>.json — same shape Unity uses for
# UNITY_CYPRESS_CONFIG. Callers pass `secrets: inherit`.

on:
  workflow_call:
    inputs:
      env_name:
        description: "Cypress environment name: dev | test | uat | prod"
        required: true
        type: string
      base_url:
        description: "Optional baseUrl override — use to target a feature branch deployment instead of the default env URL"
        required: false
        type: string
        default: ""
      cypress_config_key:
        description: "Key in GRANTS_CYPRESS_CONFIG for this env (e.g. CYPRESS_CONFIG_DEV)"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: applications/Grants.AutoUI

jobs:
  cypress:
    name: Cypress E2E — ${{ inputs.env_name }}
    runs-on:
      group: Larger Runners - OpenShift Static-IP

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # workflow_run sets github.sha to the default branch head, not the
          # commit that was built — check out the triggering commit instead.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: applications/Grants.AutoUI/package-lock.json

      - name: Write environment config
        # Extract this env's entry from GRANTS_CYPRESS_CONFIG into
        # cypress/config/<env>.json. A value may be stored as a nested object or
        # as a JSON string; both are accepted. Using env: avoids shell
        # interpolation issues with quotes inside the JSON.
        # Every non-URL string leaf is masked individually, since GitHub only
        # masks the secret's raw text (per line), not values jq re-serializes.
        run: |
          set -euo pipefail
          if [ -z "$GRANTS_CYPRESS_CONFIG" ]; then
            echo "::error::GRANTS_CYPRESS_CONFIG secret is not set" >&2
            exit 1
          fi
          ENV_CONFIG=$(jq -c --arg k "$CONFIG_KEY" '.[$k] // empty | if type == "string" then fromjson else . end' <<< "$GRANTS_CYPRESS_CONFIG")
          if [ -z "$ENV_CONFIG" ]; then
            echo "::error::Key $CONFIG_KEY not found in GRANTS_CYPRESS_CONFIG" >&2
            exit 1
          fi
          jq -r '.. | strings | select(length > 0 and (test("^https?://") | not))' <<< "$ENV_CONFIG" | while IFS= read -r v; do
            echo "::add-mask::$v"
          done
          echo "$ENV_CONFIG" > "cypress/config/${ENV_NAME}.json"
        env:
          GRANTS_CYPRESS_CONFIG: ${{ secrets.GRANTS_CYPRESS_CONFIG }}
          CONFIG_KEY: ${{ inputs.cypress_config_key }}
          ENV_NAME: ${{ inputs.env_name }}

      - name: Install dependencies
        # --ignore-scripts blocks dependency lifecycle scripts (Sonar githubactions:S6505).
        # Cypress downloads its binary in postinstall, so install it explicitly afterwards.
        run: |
          npm ci --ignore-scripts
          npx cypress install

      - name: Run Cypress tests
        # BASE_URL is appended when provided, overriding the URL in the env config file.
        # cypress.config.ts gives runtimeEnv priority over file config, so --env baseUrl=X wins.
        run: |
          EXTRA_ENV="ENV=${{ inputs.env_name }}"
          if [ -n "$BASE_URL" ]; then
            EXTRA_ENV="$EXTRA_ENV,baseUrl=$BASE_URL"
          fi
          npm run cy:run -- --env "$EXTRA_ENV"
        env:
          BASE_URL: ${{ inputs.base_url }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-screenshots-${{ inputs.env_name }}-${{ github.run_number }}
          path: applications/Grants.AutoUI/cypress/screenshots
          if-no-files-found: ignore
