name: Cypress E2E — Prod

# Manual-only — triggered after UAT sign-off, not automatically after deployment.
#
# Credentials: CYPRESS_CONFIG_PROD key of the GRANTS_CYPRESS_CONFIG repo
# secret — see cypress-e2e-runner.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress:
    uses: ./.github/workflows/cypress-e2e-runner.yml
    with:
      env_name: prod
      cypress_config_key: CYPRESS_CONFIG_PROD
    secrets: inherit
