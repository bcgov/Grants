name: Dev2 - Build & Push docker images
permissions:
  contents: read

on:
  # Manual only -- dev2 has no dedicated git branch (it shares ce395f-dev with dev, and the
  # gitops side already syncs argocd/apps/dev2/* off the dev branch), so this is triggered
  # on demand rather than on every push to dev.
  workflow_dispatch:

env:
  TARGET_ENV: dev2
  GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
  OC_CLUSTER: ${{ vars.OPENSHIFT_CLUSTER }}
  OC_REGISTRY: ${{ vars.OPENSHIFT_REGISTRY }}
  OC_TARGET_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
  OC_TARGET_PROJECT: ${{ vars.OPENSHIFT_NAMESPACE }}
  JFROG_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
  JFROG_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
  JFROG_REPO_PATH: ${{ vars.ARTIFACTORY_REPO }}
  JFROG_SERVICE:  ${{ vars.ARTIFACTORY_SERVICE }}

jobs:
  Setup:
    runs-on: ubuntu-latest
    environment: dev2
    steps:
    - name: Get variables
      run: |
        echo "Target: $TARGET_ENV"
        echo "BaseRef: $GITHUB_REF_NAME"
        echo "Environment: $TARGET_ENV OC_TARGET_PROJECT=$OC_TARGET_PROJECT"
        echo "Environment: $TARGET_ENV JFROG_REPO_PATH=$JFROG_REPO_PATH"
        echo "..."
        env | sort
  Branch:
    needs: [Setup]
    runs-on: ubuntu-latest
    environment: dev2
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
          fetch-depth: '1'
    - name: Get short commitId
      id: get_commit
      run: |
        echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
    outputs:
      SHA_SHORT: ${{steps.get_commit.outputs.SHA_SHORT}}
  Build:
    needs: [Setup,Branch]
    runs-on: ubuntu-latest
    environment: dev2
    steps:
    - uses: actions/checkout@v6
    - name: Build Docker images
      run: |
        docker build --build-arg GRANTS_BUILD_VERSION=dev2 --build-arg GRANTS_BUILD_REVISION=${{needs.Branch.outputs.SHA_SHORT}} -t grants-applicant-portal-backend -f applications/Grants.ApplicantPortal/src/Grants.ApplicantPortal.Backend/Dockerfile applications/Grants.ApplicantPortal/src/Grants.ApplicantPortal.Backend
        docker build --build-arg GRANTS_BUILD_VERSION=dev2 --build-arg GRANTS_BUILD_REVISION=${{needs.Branch.outputs.SHA_SHORT}} --build-arg BUILD_CONFIG=deploy -t grants-applicant-portal-frontend -f applications/Grants.ApplicantPortal/src/Grants.ApplicantPortal.Frontend/Dockerfile applications/Grants.ApplicantPortal/src/Grants.ApplicantPortal.Frontend
        echo "Building Docker image for database migrator..."
        docker build -f applications/Grants.ApplicantPortal/src/Grants.ApplicantPortal.Backend/src/Grants.ApplicantPortal.API.Migrations/Dockerfile -t dev2-applicantportal-dbmigrator applications/Grants.ApplicantPortal/src/Grants.ApplicantPortal.Backend
      working-directory: ./
    - name: Push application images to Artifactory container registry
      continue-on-error: true
      run: |
        echo "$JFROG_PASSWORD" | docker login -u "$JFROG_USERNAME" --password-stdin $JFROG_SERVICE
        docker tag grants-applicant-portal-backend $JFROG_SERVICE/$JFROG_REPO_PATH/grants-applicant-portal-backend:latest
        docker push $JFROG_SERVICE/$JFROG_REPO_PATH/grants-applicant-portal-backend:latest
        docker tag grants-applicant-portal-frontend $JFROG_SERVICE/$JFROG_REPO_PATH/grants-applicant-portal-frontend:latest
        docker push $JFROG_SERVICE/$JFROG_REPO_PATH/grants-applicant-portal-frontend:latest
        docker tag dev2-applicantportal-dbmigrator $JFROG_SERVICE/$JFROG_REPO_PATH/dev2-applicantportal-dbmigrator:latest
        docker push $JFROG_SERVICE/$JFROG_REPO_PATH/dev2-applicantportal-dbmigrator:latest
        docker logout $JFROG_SERVICE
    - name: Install OpenShift CLI
      run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz
          tar -xvf oc.tar.gz
          sudo mv oc /usr/local/bin
    - name: Verify OpenShift CLI installation
      run: oc version
    - name: Push application images into ce395f-dev (no ce395f-tools hop for dev2)
      run: |
        oc login --token=$OC_TARGET_TOKEN --server=$OC_CLUSTER
        oc registry login
        docker login -u unused -p $(oc whoami -t) $OC_REGISTRY
        docker tag grants-applicant-portal-backend $OC_REGISTRY/$OC_TARGET_PROJECT/$TARGET_ENV-grants-applicant-portal-backend:latest
        docker push $OC_REGISTRY/$OC_TARGET_PROJECT/$TARGET_ENV-grants-applicant-portal-backend:latest
        docker tag grants-applicant-portal-frontend $OC_REGISTRY/$OC_TARGET_PROJECT/$TARGET_ENV-grants-applicant-portal-frontend:latest
        docker push $OC_REGISTRY/$OC_TARGET_PROJECT/$TARGET_ENV-grants-applicant-portal-frontend:latest
        docker tag dev2-applicantportal-dbmigrator $OC_REGISTRY/$OC_TARGET_PROJECT/$TARGET_ENV-grants-applicant-portal-dbmigrator:latest
        docker push $OC_REGISTRY/$OC_TARGET_PROJECT/$TARGET_ENV-grants-applicant-portal-dbmigrator:latest
        docker logout $OC_REGISTRY
    - name: Run dbMigrator Job
      run: |
        oc -n $OC_TARGET_PROJECT delete jobs $TARGET_ENV-grants-applicant-portal-dbmigrator --ignore-not-found=true
        oc -n $OC_TARGET_PROJECT process unity-applicantportal-dbmigrator-job \
          -p APPLICATION_GROUP=$TARGET_ENV-unity-applicant-portal \
          -p DATABASE_SERVICE_NAME=$TARGET_ENV-unity-applicant-portal \
          -p APPLICATION_NAME=$TARGET_ENV-grants-applicant-portal-dbmigrator \
          -p IMAGEPULL_NAMESPACE=$OC_TARGET_PROJECT \
          -p IMAGESTREAM_NAME=$TARGET_ENV-grants-applicant-portal-dbmigrator \
          -p IMAGESTREAM_TAG=latest | oc -n $OC_TARGET_PROJECT create -f -
        oc -n $OC_TARGET_PROJECT wait jobs/$TARGET_ENV-grants-applicant-portal-dbmigrator --for condition=complete --timeout=300s
    - name: Roll out backend/frontend and wait
      run: |
        oc -n $OC_TARGET_PROJECT rollout restart statefulset $TARGET_ENV-grants-api
        oc -n $OC_TARGET_PROJECT rollout restart statefulset $TARGET_ENV-grants-web
        oc -n $OC_TARGET_PROJECT rollout status statefulset $TARGET_ENV-grants-api --timeout=180s
        oc -n $OC_TARGET_PROJECT rollout status statefulset $TARGET_ENV-grants-web --timeout=180s
