name: Cypress E2E — On Demand

# For spec development on feature/bugfix branches.
# Trigger this manually from your branch in the GitHub Actions UI:
#   Actions → Cypress E2E — On Demand → Run workflow → select your branch → pick env
#
# Your branch's specs are checked out and run against the chosen live environment.
# Credentials come from the CYPRESS_CONFIG_DEV/TEST keys of the
# GRANTS_CYPRESS_CONFIG repo secret — no extra setup needed.

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - test
        default: dev

permissions:
  contents: read

jobs:
  cypress:
    uses: ./.github/workflows/cypress-e2e-runner.yml
    with:
      env_name: ${{ inputs.env_name }}
      cypress_config_key: CYPRESS_CONFIG_${{ inputs.env_name == 'test' && 'TEST' || 'DEV' }}
    secrets: inherit
